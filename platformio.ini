; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ${PROJECT_DIR}/Code/Release/DIGIduinoV1/
; Rechner-/OS-spezifische Overrides (z. B. upload_port) aus *.local.ini,
; siehe platformio.local.ini. Fehlt die Datei, greifen die Defaults unten.
; extra_configs = *.local.ini

[env:ATmega328]
platform = atmelavr
; ATmega328P (Signatur 1E 95 0F) -- nicht "ATmega328" (1E 95 14)
board = ATmega328P
framework = arduino
lib_deps = 
    deanisme/SevSeg@^3.7.2
    makuna/RTC@^2.5.0

upload_protocol = custom
; Windows: COMx (pio device list) -- Linux: /dev/ttyACM*
upload_port = COM12
upload_speed = 19200
upload_flags =
    -C
    ; use "tool-avrdude-megaavr" for the atmelmegaavr platform
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -c
    stk500v1
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i